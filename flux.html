<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur M3U8</title>
<style>
  :root { --bg:#14171c; --panel:#1d2229; --text:#e8ecf1; --muted:#8b95a3; --accent:#3aa0ff; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px 16px; gap:16px; }
  form { display:flex; gap:8px; width:100%; max-width:960px; }
  input { flex:1; min-width:0; padding:12px 14px; border:1px solid #2c343e; border-radius:8px;
          background:var(--panel); color:var(--text); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button { padding:12px 22px; border:0; border-radius:8px; background:var(--accent); color:#04121f;
           font:inherit; font-weight:600; cursor:pointer; }
  video { width:100%; max-width:960px; aspect-ratio:16/9; background:#000; border-radius:10px; }
  #status { width:100%; max-width:960px; min-height:1.5em; color:var(--muted); font-size:14px; }
  #status.err { color:var(--err); }
</style>
</head>
<body>
  <form id="f">
    <input id="url" type="url" placeholder="Colle ton lien .m3u8 ici" autocomplete="off" required>
    <button type="submit">Lire</button>
  </form>
  <video id="v" controls playsinline></video>
  <div id="status">Colle un lien et clique sur Lire.</div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script>
    const video = document.getElementById('v');
    const input = document.getElementById('url');
    const status = document.getElementById('status');
    let hls = null;

    function say(msg, isErr) { status.textContent = msg; status.className = isErr ? 'err' : ''; }

    function play(src) {
      if (hls) { hls.destroy(); hls = null; }
      video.removeAttribute('src');
      say('Chargement…');

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { say('Lecture en cours.'); video.play().catch(() => {}); });
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (!d.fatal) return;
          if (d.type === Hls.ErrorTypes.NETWORK_ERROR)
            say('Erreur réseau : lien invalide, expiré, ou serveur qui bloque (CORS).', true);
          else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          else say('Erreur de lecture : ' + d.details, true);
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;            // Safari / iOS : lecture native
        video.play().catch(() => {});
        say('Lecture en cours.');
      } else {
        say("Ton navigateur ne gère pas le format HLS.", true);
      }
    }

    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      const src = input.value.trim();
      play(src);
      history.replaceState(null, '', '#' + encodeURIComponent(src));
    });

    // Lien partageable : fichier.html#https%3A%2F%2F...m3u8
    if (location.hash.length > 1) {
      input.value = decodeURIComponent(location.hash.slice(1));
      play(input.value);
    }
  </script>
</body>
</html>
